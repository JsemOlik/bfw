[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

[program:nginx]
command=nginx -g "daemon off;"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

[program:vite]
command=/bin/bash -c 'if [ "$APP_ENV" != "production" ]; then exec bun dev --host=0.0.0.0; else echo "Skipping Vite in production"; sleep 3600; fi'

[program:queue]
command=/bin/bash -c 'exec php artisan queue:work "${QUEUE_CONNECTION:-redis}" --sleep=1 --tries=1 --timeout=300 --max-time=3600 --no-interaction'
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true

[program:scheduler]
command=php artisan schedule:work --no-interaction
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
